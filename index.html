<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hangman</title>
    <script defer src="./app.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>hangman</h1>
      <p>Guess the word before you run out of tries!</p>
      <p>Choose a category to start playing!</p>
      <button id="start-game">Start Game</button>
      <button id="restart">play again</button>
      <div id="letters" class="letters">
        <button>A</button>
        <button>B</button>
        <button>C</button>
        <button>D</button>
        <button>E</button>
        <button>F</button>
        <button>G</button>
        <button>H</button>
        <button>I</button>
        <button>J</button>
        <button>K</button>
        <button>L</button>
        <button>M</button>
        <button>N</button>
        <button>O</button>
        <button>P</button>
        <button>Q</button>
        <button>R</button>
        <button>S</button>
        <button>T</button>
        <button>U</button>
        <button>V</button>
        <button>W</button>
        <button>X</button>
        <button>Y</button>
        <button>Z</button>
      </div>
      <div id="category-menu">
        <button data-category="fruits">Fruits</button>
        <button data-category="animals">Animals</button>
        <button data-category="jobs">Jobs</button>
        <button data-category="countries">Countries</button>
        <button data-category="colors">Colors</button>
        <button data-category="sports">Sports</button>
        <button data-category="carBrands">Car Brands</button>
        <button data-category="musicGenres">Music Genres</button>
        <button data-category="movieGenres">Movie Genres</button>
        <button data-category="shapes">Shapes</button>
        <button data-category="planets">Planets</button>
        <button data-category="seasons">Seasons</button>
        <button data-category="elements">Elements</button>
      </div>

      <div id="word-display"></div>
    </header>
  </body>
</html>
